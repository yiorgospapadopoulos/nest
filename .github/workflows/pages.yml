# Serves the latest release's install.sh at https://yiorgospapadopoulos.github.io/nest/install.sh,
# where https://nestcode.app/install forwards, so the install line stays short. The script is the release's own file, copied unchanged;
# everything it downloads is still checked against the release's signature. The deploying
# actions are pinned to commits, as this job publishes the script every new install trusts.
name: pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  install-script:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}install.sh
    steps:
      - name: Take install.sh from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir site
          gh release download --repo "$GITHUB_REPOSITORY" --pattern install.sh --dir site
          test -s site/install.sh
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
