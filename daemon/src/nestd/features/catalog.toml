group = "git"
name = "Merge when checks pass"
text = "Switch it on for a pull request and it merges by itself once its checks pass. GitHub does it when the repository requires those checks; otherwise Nest does, while it is running. New commits after you switch it on cancel it and bring back the merge approval."
where = "Pull request popover"
added = 2026-11-08
changed = 2026-11-09
block = "B149"

[[features]]
id = "stacked-pull-requests"
group = "git"
name = "Stacked pull requests"
text = "Start a chat on top of another chat's branch. Its pull request goes into that branch, and when the one under it merges, Nest moves it onto the new base and waits for your click to push."
where = "Pull request popover > New chat on top, and Needs you"
added = 2026-11-08
block = "B149"

[[features]]
id = "review-guide"
group = "git"
name = "A review guide for a pull request"
text = "An agent reads the pull request's changes and writes what changed, where to look and the risks. It opens like any artifact, and you can post it on the pull request."
where = "Pull request popover > Write review guide"
added = 2026-11-08
block = "B149"
