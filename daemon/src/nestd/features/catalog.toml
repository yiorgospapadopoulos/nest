# What Nest can do, shown in Settings > Features (B103). Only the features that make Nest
# different; the README has every detail. Every block that adds or changes a user-visible
# feature adds or updates its entry here in the same work.
#
# Groups show in this order, features in file order within their group.
# A feature: a unique kebab-case `id`, its `group`, a short `name`, one or two plain sentences
# of `text` (`backticks` show as code), `where` to find it, the date it was `added`, the
# `block` that added it, and an optional `changed` date that shows it as new again.

[[groups]]
id = "around"
name = "Getting around"

[[groups]]
id = "chats"
name = "Chats"

[[groups]]
id = "git"
name = "Worktrees and git"

[[groups]]
id = "pixies"
name = "Pixies"

[[groups]]
id = "artifacts"
name = "Artifacts"

[[groups]]
id = "engines"
name = "Engines and devices"

