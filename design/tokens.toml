# Window wallpapers: a base color under three soft radial glows. Geometry in percent:
# `center` and `size` (ellipse radii) relative to the window, `fade` where the glow ends.
[wallpaper]
default = "stone"

[wallpaper.options.stone]
base = { light = "#ebe6de", dark = "#191713" }
stops = [
    { color = { light = "#d8cdbd", dark = "#3b342a" }, center = [12, 18], size = [55, 65], fade = 70 },
    { color = { light = "#e4d9c9", dark = "#2c271f" }, center = [88, 10], size = [50, 60], fade = 70 },
    { color = { light = "#c9c1b4", dark = "#4a4236" }, center = [62, 100], size = [70, 70], fade = 72 },
]

[wallpaper.options.sage]
base = { light = "#e3e8df", dark = "#121612" }
stops = [
    { color = { light = "#c2d1bc", dark = "#2a3a2b" }, center = [85, 85], size = [60, 60], fade = 70 },
    { color = { light = "#d5dfcd", dark = "#1f2a20" }, center = [10, 90], size = [55, 60], fade = 70 },
    { color = { light = "#b2c2b5", dark = "#3a4a3c" }, center = [40, 0], size = [60, 60], fade = 72 },
]

[wallpaper.options.sky]
base = { light = "#e2e9ef", dark = "#10151b" }
stops = [
    { color = { light = "#c0d3e2", dark = "#23384a" }, center = [0, 50], size = [50, 60], fade = 70 },
    { color = { light = "#d4e0e9", dark = "#1a2833" }, center = [100, 20], size = [55, 60], fade = 70 },
    { color = { light = "#b6c8d5", dark = "#2f4658" }, center = [60, 100], size = [60, 60], fade = 72 },
]

[wallpaper.options.slate]
base = { light = "#e0e3e7", dark = "#121417" }
stops = [
    { color = { light = "#c1c8d0", dark = "#2b3139" }, center = [18, 30], size = [45, 55], fade = 70 },
    { color = { light = "#d0d6dd", dark = "#20252c" }, center = [82, 25], size = [45, 55], fade = 70 },
    { color = { light = "#acb5c0", dark = "#3a424d" }, center = [50, 100], size = [60, 60], fade = 70 },
]

# The iPhone app's radii and spacing come from the glass themes; these are the Mac's, in
# points.
[radius]
mac_chip = 4
mac_button = 5
mac_row = 6
mac_card = 8
mac_bubble = 9
mac_sheet = 12

[spacing]
mac_strip_height = 34
mac_header_height = 34
mac_row_height = 26
mac_button_height = 22
# One scanline every this many points.
mac_scanline_period = 3

[typography.family]
system = ["-apple-system", "BlinkMacSystemFont", "SF Pro Text", "SF Pro Display", "Helvetica Neue", "Helvetica", "Arial", "sans-serif"]
mono = ["ui-monospace", "SF Mono", "SFMono-Regular", "Menlo", "Monaco", "Consolas", "monospace"]

# Font sizes in points, used by the Mac app.
[typography.size]
micro = 10
caption = 11
label = 11.5
small = 12
callout = 12.5
body = 13
subhead = 14
headline = 17

[typography.weight]

[typography.line_height]

# Durations in milliseconds, used by the Mac app's animations.
[motion.duration]
pulse = 1800
attention = 2600

[motion.easing]
# Sheets, chats and cards sliding in the iPhone app.
glide = [0.2, 0.9, 0.25, 1]
