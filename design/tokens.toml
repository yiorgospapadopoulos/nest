# Design tokens for Nest, the single source for the PWA (CSS) and the Mac app (Swift).
# Values come from the locked mockups (D020, D021). Regenerate after editing:
#   cd daemon && uv run nestd design generate
#
# Colors are `#rrggbb` or `rgba(r,g,b,a)`. Every color has a light and a dark value.
# Names are snake_case; they become kebab-case CSS variables and camelCase Swift names.

# Neutrals, grouped by role. CSS: --<group>-<name>, for example --text-primary.
[colors.page]
base = { light = "#eeeeec", dark = "#0c0c0d" }

[colors.text]
primary = { light = "#1a1b20", dark = "#f2f3f7" }
secondary = { light = "rgba(26,27,32,0.68)", dark = "rgba(242,243,247,0.7)" }
# Tertiary reads at 4.5:1 on the page, the wallpapers and the glass themes over them, except
# Smoke and Deep in light mode (3.88) and directly over the wallpapers' darkest glows.
tertiary = { light = "rgba(26,27,32,0.64)", dark = "rgba(242,243,247,0.56)" }

[colors.line]
hairline = { light = "rgba(0,0,0,0.08)", dark = "rgba(255,255,255,0.09)" }
strong = { light = "rgba(0,0,0,0.16)", dark = "rgba(255,255,255,0.18)" }

[colors.fill]
subtle = { light = "rgba(0,0,0,0.045)", dark = "rgba(255,255,255,0.065)" }
strong = { light = "rgba(0,0,0,0.085)", dark = "rgba(255,255,255,0.12)" }

[colors.surface]
code = { light = "rgba(255,255,255,0.55)", dark = "rgba(0,0,0,0.25)" }
scrim = { light = "rgba(236,238,246,0.34)", dark = "rgba(0,0,0,0.3)" }
# User message bubble when the "neutral" bubble color is chosen instead of the accent.
neutral_bubble = { light = "rgba(255,255,255,0.92)", dark = "rgba(255,255,255,0.12)" }

# The Mac app's look (D073), with MonoCode's darker, crisper values (B39): a #171717 base
# and #ebebeb content in dark; lines, fills and secondary text are the content color at
# MonoCode's strengths (lines 7 percent, fills 3 to 10, text 55 and 40), drawn here over the
# base; light mode keeps its own colors at the same strengths. The iPhone app does not use
# these. CSS: --mac-<name>; Swift: DesignTokens.Colors.Mac.
[colors.mac]
# The window: a tint over the desktop's blur, and the same color opaque for fullscreen,
# Reduce Transparency and offscreen snapshots.
window = { light = "rgba(248,248,246,0.36)", dark = "rgba(23,23,23,0.36)" }
window_opaque = { light = "#f8f8f6", dark = "#171717" }
# Sidebar and right panel darker than the panes (MonoCode: the base mixed 10 percent toward
# black); the board on the base; chat panes a soft card in light, the base in dark.
side = { light = "rgba(0,0,0,0.02)", dark = "rgba(0,0,0,0.1)" }
pane = { light = "rgba(255,255,255,0.25)", dark = "rgba(0,0,0,0)" }
chat_pane = { light = "rgba(255,255,255,0.55)", dark = "rgba(0,0,0,0)" }
# With a chat background image (B39), the window's chrome lays this over the blurred image,
# leaving a deep tint of its colors.
backdrop_tint = { light = "rgba(248,248,246,0.82)", dark = "rgba(23,23,23,0.82)" }
# Sheets, popovers, menus and floating banners, over the window's content: the base with
# MonoCode's 2 percent popover fill.
sheet = { light = "rgba(251,251,250,0.98)", dark = "rgba(27,27,27,0.98)" }
selection = { light = "rgba(28,28,29,0.06)", dark = "rgba(235,235,235,0.1)" }
# Faint fills: the composer, cards and fields, hovered rows, and the user's message and bar
# tracks.
composer = { light = "rgba(28,28,29,0.03)", dark = "rgba(235,235,235,0.03)" }
soft = { light = "rgba(28,28,29,0.045)", dark = "rgba(235,235,235,0.045)" }
hover = { light = "rgba(28,28,29,0.05)", dark = "rgba(235,235,235,0.07)" }
raised = { light = "rgba(28,28,29,0.06)", dark = "rgba(235,235,235,0.1)" }
divider = { light = "rgba(28,28,29,0.07)", dark = "rgba(235,235,235,0.07)" }
scanline = { light = "rgba(0,0,0,0.03)", dark = "rgba(255,255,255,0.022)" }
# Content, then the content at 55 and 52 percent over the base: icons, meta lines and tool
# lines read about as bright as secondary text (raised from 40 percent, B39).
text_primary = { light = "#1c1c1d", dark = "#ebebeb" }
text_secondary = { light = "#7f7f7f", dark = "#8c8c8c" }
text_tertiary = { light = "#868585", dark = "#858585" }
link = { light = "#0a6fd6", dark = "#4ea7ff" }
# Status: needs you, running, done well, failed.
wait = { light = "#b06d06", dark = "#e7a23e" }
run = { light = "#4b59d6", dark = "#7f8cff" }
ok = { light = "#23843c", dark = "#4fc76f" }
bad = { light = "#cf3b30", dark = "#ff6b5f" }
# The primary button with the default (graphite) accent; other accents color it instead.
button = { light = "#1c1c1d", dark = "rgba(255,255,255,0.88)" }
button_text = { light = "#ffffff", dark = "#1b1b1c" }

[colors.diff]
added_fill = { light = "rgba(34,165,89,0.13)", dark = "rgba(53,208,122,0.15)" }
added_text = { light = "#14723a", dark = "#6be3a0" }
removed_fill = { light = "rgba(229,72,77,0.11)", dark = "rgba(255,105,97,0.14)" }
removed_text = { light = "#bd2c27", dark = "#ff9a93" }

[colors.signal]
approve = { light = "#1f9a52", dark = "#23904e" }
running_ring = { light = "rgba(10,122,255,0.45)", dark = "rgba(61,155,255,0.5)" }
# Amber glow on a background project tab that needs the user.
attention_glow = { light = "rgba(240,154,18,0.55)", dark = "rgba(255,179,64,0.5)" }

# Fixed semantic status colors: a dot or bar (fill), readable text, and a soft background.
[status.running]
fill = { light = "#0a7aff", dark = "#3d9bff" }
text = { light = "#0062d1", dark = "#7ab8ff" }
soft = { light = "rgba(10,122,255,0.12)", dark = "rgba(61,155,255,0.17)" }

[status.waiting]
fill = { light = "#f09a12", dark = "#ffb340" }
text = { light = "#8f5100", dark = "#ffc466" }
soft = { light = "rgba(240,154,18,0.16)", dark = "rgba(255,179,64,0.16)" }

[status.review]
fill = { light = "#22a559", dark = "#35d07a" }
text = { light = "#14723a", dark = "#5fe09a" }
soft = { light = "rgba(34,165,89,0.13)", dark = "rgba(53,208,122,0.15)" }

[status.failed]
fill = { light = "#e5484d", dark = "#ff6961" }
text = { light = "#bd2c27", dark = "#ff8f88" }
soft = { light = "rgba(229,72,77,0.12)", dark = "rgba(255,105,97,0.15)" }

[status.done]
fill = { light = "#8a8f98", dark = "#8e9199" }
text = { light = "#5a5e66", dark = "#a8abb3" }
soft = { light = "rgba(138,143,152,0.16)", dark = "rgba(142,145,153,0.18)" }

[status.interrupted]
fill = { light = "#8a7b6b", dark = "#b3a493" }
text = { light = "#6b5d4f", dark = "#c9bba9" }
soft = { light = "rgba(138,123,107,0.16)", dark = "rgba(179,164,147,0.16)" }

# User-selectable accents. `on` is the text color drawn on top of the accent fill.
[accent]
default = "graphite"

[accent.options.graphite]
fill = { light = "#2b2b2e", dark = "#e6e6e9" }
on = { light = "#ffffff", dark = "#141416" }

[accent.options.ocean]
fill = { light = "#2c6a9a", dark = "#79b4e3" }
on = { light = "#ffffff", dark = "#141416" }

[accent.options.teal]
fill = { light = "#1f7a78", dark = "#5cc4bf" }
on = { light = "#ffffff", dark = "#141416" }

[accent.options.moss]
fill = { light = "#55702f", dark = "#a5c26f" }
on = { light = "#ffffff", dark = "#141416" }

[accent.options.clay]
fill = { light = "#a5573a", dark = "#e39a78" }
on = { light = "#ffffff", dark = "#141416" }

[accent.options.rose]
fill = { light = "#a34a62", dark = "#e293a9" }
on = { light = "#ffffff", dark = "#141416" }

# Liquid Glass panels. Blur in points, saturation in percent.
[glass]
border = { light = "rgba(255,255,255,0.64)", dark = "rgba(255,255,255,0.13)" }
specular = { light = "rgba(255,255,255,0.95)", dark = "rgba(255,255,255,0.22)" }
outline = { light = "rgba(16,24,40,0.1)", dark = "rgba(0,0,0,0.5)" }
shadow = { light = "rgba(28,34,70,0.2)", dark = "rgba(0,0,0,0.55)" }
blur = { normal = 20, heavy = 30 }
saturation = 185

[glass.tint]
regular = { light = "rgba(255,255,255,0.5)", dark = "rgba(34,36,48,0.5)" }
strong = { light = "rgba(255,255,255,0.76)", dark = "rgba(28,30,40,0.76)" }
clear = { light = "rgba(255,255,255,0.28)", dark = "rgba(255,255,255,0.05)" }

# Glass themes (D039), chosen by the user. The default theme defines every value; the others
# override only what they change and inherit the rest. CSS: variables on :root and on
# [data-glass="<id>"]. Colors: tint (panel), surface (strong), surface_subtle, stroke (border),
# edge (outer line), highlight (specular top edge), rim (bottom edge), shadow_color, strip
# (project tabs), shell (window behind panels). Backdrop blur in points, saturation in percent;
# radii, spacing and shadow offset, blur and spread in points.
[glass.themes]
default = "clear"

[glass.themes.options.clear]
name = "Clear"
description = "The base layer. Barely tinted, light blur, the most see-through."
backdrop = { blur = 10, saturation = 160 }
radius = { window = 24, panel = 20, pane = 18, card = 14, item = 10, control = 999, small = 7, tab = 12 }

[glass.themes.options.clear.spacing]
gap = 10
row_padding_y = 7
transcript_padding_top = 14
transcript_padding_x = 16
transcript_padding_bottom = 10
transcript_gap = 11
strip_height = 46
toolbar_height = 48

[glass.themes.options.clear.shadow]
panel = { y = 10, blur = 28, spread = -16 }
window_far = { y = 50, blur = 100, spread = -40 }
window_near = { y = 18, blur = 36, spread = -18 }

[glass.themes.options.clear.colors]
tint = { light = "rgba(255,255,255,0.2)", dark = "rgba(24,26,32,0.26)" }
surface = { light = "rgba(250,250,252,0.68)", dark = "rgba(30,32,38,0.74)" }
surface_subtle = { light = "rgba(255,255,255,0.1)", dark = "rgba(255,255,255,0.035)" }
stroke = { light = "rgba(255,255,255,0.5)", dark = "rgba(255,255,255,0.14)" }
edge = { light = "rgba(16,24,40,0.12)", dark = "rgba(0,0,0,0.5)" }
highlight = { light = "rgba(255,255,255,0.85)", dark = "rgba(255,255,255,0.2)" }
rim = { light = "rgba(255,255,255,0.18)", dark = "rgba(255,255,255,0.04)" }
shadow_color = { light = "rgba(20,28,50,0.16)", dark = "rgba(0,0,0,0.45)" }
strip = { light = "rgba(255,255,255,0.06)", dark = "rgba(0,0,0,0.14)" }
shell = { light = "rgba(255,255,255,0.1)", dark = "rgba(10,12,16,0.12)" }

[glass.themes.options.frosted]
name = "Frosted"
description = "Milky glass with a heavy blur. The most readable."
backdrop = { blur = 48, saturation = 140 }
radius = { panel = 22, pane = 20, card = 16, item = 11 }
shadow = { panel = { y = 8, blur = 24, spread = -14 } }

[glass.themes.options.frosted.colors]
tint = { light = "rgba(248,248,250,0.72)", dark = "rgba(46,48,54,0.74)" }
surface = { light = "rgba(252,252,253,0.9)", dark = "rgba(52,54,60,0.92)" }
